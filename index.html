<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connie 商店 — AI-Connie 的 AI 产品商店</title>
<meta name="description" content="Connie 商店：AI-Connie 一天一个 AI 小产品，用顶级模型做的免费小工具与小游戏，全记录在这。">
<meta name="keywords" content="Connie 商店,AI-Connie,connie store,AI 产品,AI 小工具,免费 AI">
<link rel="canonical" href="https://aiconnie.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Connie 商店">
<meta property="og:title" content="Connie 商店 — AI-Connie 的 AI 产品商店">
<meta property="og:description" content="一天一个 AI 小产品，用顶级模型做的免费小工具与小游戏，全记录在这。">
<meta property="og:url" content="https://aiconnie.app/">
<meta property="og:image" content="https://aiconnie.app/connie-avatar.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/jpeg" href="connie-avatar.jpg">
<link rel="apple-touch-icon" href="connie-avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E8;
    --bg-card: #FFFDF8;
    --ink: #2E2A24;
    --ink-soft: #6B6359;
    --ink-faint: #A39E95;
    --ink-ghost: #CBC6BD;
    --rule: #DDD7CD;
    --rule-light: #EBE7E0;
    --accent: #7B8F6B;
    --accent-soft: #7B8F6B22;
    --xhs: #D14D3D;
    --xhs-soft: #D14D3D10;
    --radius: 6px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    font-family: "Outfit", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    /* clean warm background, no external assets */
  }

  .page {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }

  /* ================================================================
     TOP ROW — Profile
     ================================================================ */
  .profile {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 32px 0 22px;
  }

  .profile-left {
    display: flex;
    align-items: center;
    gap: 11px;
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    outline: 1.5px solid var(--rule);
    outline-offset: 2px;
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .profile-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
    margin-bottom: 5px;
  }
  .badge-xhs {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 9px;
    font-weight: 600;
    color: var(--xhs);
    background: var(--xhs-soft);
    padding: 2px 6px 2px 5px;
    border-radius: 3px;
    letter-spacing: 0.02em;
    line-height: 1;
    text-decoration: none;
    transition: background .15s;
  }
  .badge-xhs:hover { background: #D14D3D20; }
  .badge-xhs::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--xhs);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .profile-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-ghost);
    letter-spacing: 0.03em;
  }

  .profile-right {
    text-align: right;
    padding-top: 2px;
  }
  .profile-bio {
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-faint);
    max-width: 200px;
    text-wrap: balance;
  }
  .capy-btn {
    display: inline-block;
    margin-top: 8px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #7B8F6B30;
    padding: 4px 10px;
    border-radius: 4px;
    text-decoration: none;
    letter-spacing: .01em;
    transition: background .15s, border-color .15s;
  }
  .capy-btn:hover { background: #7B8F6B18; border-color: var(--accent); }

  /* ================================================================
     STATS ROW
     ================================================================ */
  .stats {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--rule-light);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stat {
    flex: 1;
    text-align: center;
    padding: 18px 8px 16px;
    position: relative;
  }
  .stat + .stat::before {
    content: "";
    position: absolute;
    left: 0;
    top: 16px;
    bottom: 16px;
    width: 1px;
    background: var(--rule-light);
  }

  .stat-num {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 5px;
    letter-spacing: -0.02em;
  }
  .stat-num.highlight { color: var(--accent); }

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-ghost);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ================================================================
     PRODUCTS SECTION
     ================================================================ */
  .products-section {
    margin-top: 28px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 2px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .section-title::before {
    content: "—  ";
    color: var(--ink-ghost);
  }

  .section-aside {
    font-size: 10px;
    color: var(--ink-ghost);
    font-style: italic;
    font-family: "Instrument Serif", Georgia, serif;
    letter-spacing: 0.02em;
  }

  /* Category tabs */
  .cat-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-ghost);
    background: none;
    border: 1px solid var(--rule-light);
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
    font-family: inherit;
  }
  .cat-tab:hover { border-color: var(--rule); color: var(--ink-faint); }
  .cat-tab.active {
    background: var(--ink);
    color: var(--bg-card);
    border-color: var(--ink);
  }

  /* Product grid — 5 per row, breaks out wider than the 520px page */
  .products-section {
    width: 96vw;
    max-width: 1100px;
    margin-left: 50%;
    transform: translateX(-50%);
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  @media (max-width: 760px) {
    .product-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 460px) {
    .product-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  }

  .product-card {
    background: var(--bg-card);
    border: 1px solid var(--rule-light);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .product-card:hover {
    border-color: var(--rule);
    transform: translateY(-2px);
  }

  .product-card .card-icon {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    line-height: 1;
    background: linear-gradient(145deg, var(--rule-light) 0%, #EDE8E0 100%);
    overflow: hidden;
  }
  .product-card .card-icon img { width: 100%; height: 100%; object-fit: cover; }

  .product-card .card-body {
    padding: 10px 12px 11px;
    border-top: 1px solid var(--rule-light);
  }
  .product-card .card-body h3 {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
    letter-spacing: -0.01em;
  }
  .product-card .card-body p {
    font-size: 10px;
    color: var(--ink-faint);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-card .card-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    font-weight: 500;
    color: var(--accent);
    background: var(--bg-card);
    border: 1px solid var(--accent-soft);
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .product-card .card-cat {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 8px;
    font-weight: 600;
    color: var(--ink-faint);
    background: var(--bg-card);
    border: 1px solid var(--rule-light);
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }

  /* Empty state */
  .empty-state {
    padding: 40px 20px 32px;
    text-align: center;
  }
  .empty-mark {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 32px;
    color: var(--rule);
    line-height: 1;
    margin-bottom: 14px;
    user-select: none;
  }
  .empty-text {
    font-size: 13px;
    color: var(--ink-ghost);
    line-height: 1.85;
  }

  /* ================================================================
     COMMUNITY — 交流群二维码
     ================================================================ */
  .community {
    margin-top: 30px;
  }
  .community-card {
    background: var(--bg-card);
    border: 1px solid var(--rule-light);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    text-align: center;
  }
  .community-card h3 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .community-card .community-sub {
    font-size: 11.5px;
    color: var(--ink-faint);
    line-height: 1.6;
  }
  .community-qr {
    width: 216px;
    max-width: 78%;
    margin: 16px auto 11px;
    background: #fff;
    border: 1px solid var(--rule-light);
    border-radius: var(--radius);
    padding: 8px;
  }
  .community-qr img { width: 100%; display: block; border-radius: 3px; }
  .community-note {
    font-size: 9.5px;
    color: var(--ink-ghost);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ================================================================
     FOOTER
     ================================================================ */
  .foot {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--rule-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .foot-xhs {
    font-size: 11px;
    color: var(--ink-faint);
    text-decoration: none;
    transition: color .15s;
  }
  .foot-xhs:hover { color: var(--ink-soft); }
  .foot-xhs strong {
    color: var(--xhs);
    font-weight: 600;
  }

  .foot-link {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--bg-card);
    transition: border-color 0.15s;
    letter-spacing: 0.01em;
  }
  .foot-link:hover { border-color: var(--ink-soft); }

  .foot-fine {
    margin-top: 18px;
    text-align: center;
    font-size: 9.5px;
    color: var(--ink-ghost);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ================================================================
     RESPONSIVE
     ================================================================ */
  @media (max-width: 440px) {
    .page { padding: 0 18px 40px; }
    .profile { flex-direction: column; gap: 10px; padding: 24px 0 18px; }
    .profile-right { text-align: left; }
    .profile-bio { max-width: none; }
    .stat-num { font-size: 26px; }
    .stat { padding: 14px 6px 12px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ======== TOP ROW ======== -->
  <header class="profile">
    <div class="profile-left">
      <div class="avatar">
        <img src="connie-avatar.jpg" alt="AI-Connie" alt="AI-Connie">
      </div>
      <div class="profile-ident">
        <div class="profile-name">
          AI-Connie
          <a class="badge-xhs" href="https://xhslink.com/m/8Xl7Z3PaVlh" target="_blank" rel="noopener">小红书</a>
        </div>
        <div class="profile-id">2936483204</div>
      </div>
    </div>
    <div class="profile-right">
      <p class="profile-bio">一天一个 AI 小产品<br>用顶级模型，全记录在这</p>
      <a class="capy-btn" href="https://happycapy.ai/?via=connie" target="_blank" rel="noopener">来 HappyCapy 造一个 &#8599;</a>
    </div>
  </header>

  <!-- ======== STATS ROW ======== -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num highlight" id="dayCount">1</div>
      <div class="stat-label">天</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="productCount">0</div>
      <div class="stat-label">产品</div>
    </div>
    <div class="stat">
      <div class="stat-num">¥0</div>
      <div class="stat-label">全免费</div>
    </div>
  </div>

  <!-- ======== PRODUCTS ======== -->
  <section class="products-section">
    <div class="section-head">
      <h2 class="section-title">Products</h2>
      <span class="section-aside">continuously updated</span>
    </div>

    <div class="cat-tabs" id="catTabs"></div>

    <div class="product-grid" id="productGrid"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-mark">&amp;</div>
      <div class="empty-text">正在搭建中<br>每做完一个就上架到这里</div>
    </div>
  </section>

  <!-- ======== COMMUNITY ======== -->
  <section class="community">
    <div class="section-head">
      <h2 class="section-title">Community</h2>
      <span class="section-aside">join the chat</span>
    </div>
    <div class="community-card">
      <h3>加入 AI 交流群</h3>
      <p class="community-sub">扫码进群 · 一起聊 AI、催更新产品</p>
      <div class="community-qr">
        <img src="group-qr.jpg" alt="AI 交流群微信二维码">
      </div>
      <p class="community-note">微信扫一扫 · 群码定期更新</p>
    </div>
  </section>

  <!-- ======== FOOTER ======== -->
  <footer>
    <div class="foot">
      <a class="foot-xhs" href="https://xhslink.com/m/8Xl7Z3PaVlh" target="_blank" rel="noopener"><strong>小红书</strong>AI-Connie</a>
      <a class="foot-link" href="https://happycapy.ai/?via=connie" target="_blank" rel="noopener">HappyCapy &#8599;</a>
    </div>
    <p class="foot-fine">Powered by HappyCapy</p>
  </footer>

</div>

<script>
// Day counter (fixed)
document.getElementById('dayCount').textContent = 1;

// Product data — add entries to ship products
// { name, desc, icon (emoji), img (optional), cat (category), url }
// date = 上线日期；列表按上线时间倒序（越新越靠前）
const products = [
  { name: "性感上岸", desc: "驾考刷题真题库，答对解锁视频奖励 (18+)", img: "products/sexy-math-preview.png", cat: "游戏", url: "products/sexy-math.html", date: "2026-03-13" },
].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

// Render
const grid = document.getElementById('productGrid');
const empty = document.getElementById('emptyState');
const counter = document.getElementById('productCount');
const tabsEl = document.getElementById('catTabs');
let activeCat = '全部';

function getCats() {
  const cats = ['全部'];
  products.forEach(p => { if (p.cat && !cats.includes(p.cat)) cats.push(p.cat); });
  return cats;
}

function renderTabs() {
  const cats = getCats();
  if (cats.length <= 2) { tabsEl.style.display = 'none'; return; }
  tabsEl.innerHTML = cats.map(c =>
    `<button class="cat-tab${c === activeCat ? ' active' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
  tabsEl.querySelectorAll('.cat-tab').forEach(btn => {
    btn.onclick = () => { activeCat = btn.dataset.cat; renderTabs(); renderGrid(); };
  });
}

function renderGrid() {
  const filtered = activeCat === '全部' ? products : products.filter(p => p.cat === activeCat);
  counter.textContent = products.length;
  if (!products.length) { grid.style.display = 'none'; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = filtered.map(p => `
    <a class="product-card" href="${p.url || '#'}" target="_blank" rel="noopener">
      <div class="card-icon">
        ${p.img ? `<img src="${p.img}" alt="${p.name}">` : p.icon || ''}
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <p>${p.desc || ''}</p>
      </div>
      <span class="card-tag">Free</span>
      ${p.cat ? `<span class="card-cat">${p.cat}</span>` : ''}
    </a>
  `).join('');
}

renderTabs();
renderGrid();
</script>

</body>
</html>
